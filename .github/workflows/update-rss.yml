name: Update Buddy Quota RSS

on:
  schedule:
    # 每 5 分钟更新一次 (GitHub Actions cron 使用 UTC)
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Query balance & generate RSS
        env:
          BUDDY_KEY: ${{ secrets.BUDDY_KEY }}
        run: |
          python3 scripts/query_balance.py

      - name: Install Pillow & CJK fonts
        run: |
          pip install pillow
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Generate e-ink card & push to device
        env:
          DOT_TOKEN: ${{ secrets.DOT_TOKEN }}
          DEVICE_SN: ${{ secrets.DEVICE_SN }}
        run: |
          python3 scripts/push_card.py --rss rss.xml

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rss.xml
          if git diff --cached --quiet; then
            echo "RSS 无变化, 跳过提交"
          else
            git commit -m "Update RSS: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
